name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    # Backs db/postgres.py — document/chunk/feedback persistence
    # (tests/test_postgres.py, tests/test_api_integration.py). Both files
    # skip gracefully if this isn't reachable, but running it here means
    # CI actually exercises upload/delete/persistence, not just the parts
    # that don't need a database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archiva
          POSTGRES_PASSWORD: archiva_ci_password
          POSTGRES_DB: archiva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archiva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        # No GROQ_API_KEY needed: every Groq/LLM call in the suite is mocked
        # (see tests/test_api_integration.py's module docstring for the one
        # deliberate exception to that rule and why it's out of scope here).
        env:
          DATABASE_URL: postgresql://archiva:archiva_ci_password@localhost:5432/archiva
        run: pytest -v

      - name: Run retrieval-quality eval
        # BM25-only: no model download, no GROQ_API_KEY needed, matches the
        # retrieval-only scope documented in eval/run_eval.py's module docstring.
        run: python eval/run_eval.py --bm25-only

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test
