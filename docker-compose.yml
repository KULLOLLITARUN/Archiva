# Postgres for Archiva, as an alternative to installing it natively
# (docs/SETUP.md). The app itself still runs on the host (start.bat /
# start.sh): it downloads sentence-transformer models and serves the Vite
# dev server, neither of which gains anything from a container.
#
#   docker compose up -d
#
# then in .env:
#   DATABASE_URL=postgresql://archiva:archiva_dev_password@localhost:5432/archiva
#
# and to run the Postgres tests that otherwise skip (they TRUNCATE tables, so
# they only accept a database whose name ends in _test):
#   DATABASE_URL=postgresql://archiva:archiva_dev_password@localhost:5432/archiva_test pytest
#
# The password is a local-only default; set ARCHIVA_PG_PASSWORD to change it
# (it only takes effect on a fresh volume). If a native Postgres already
# holds port 5432, set ARCHIVA_PG_PORT=5433 and use that port in the URLs.

services:
  postgres:
    # Same major version CI tests against (.github/workflows/tests.yml).
    image: postgres:16
    environment:
      POSTGRES_USER: archiva
      POSTGRES_PASSWORD: ${ARCHIVA_PG_PASSWORD:-archiva_dev_password}
      POSTGRES_DB: archiva
    ports:
      # Loopback only: there is no auth on the app, so keep its database off
      # the network too.
      - "127.0.0.1:${ARCHIVA_PG_PORT:-5432}:5432"
    volumes:
      - archiva_pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is first initialised.
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archiva -d archiva"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  archiva_pgdata:
